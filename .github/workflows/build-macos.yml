# warp-lite: builds an unsigned macOS app bundle on GitHub's macOS runners,
# which ship with Xcode (needed for the Metal shader compiler).
name: Build macOS app

on:
  push:
    branches: ["lite/**"]
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub's macOS arm64 pool is often out of capacity, so also build on the
    # Intel pool, cross-compiling to arm64. Both produce the same app.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: native
          - runner: macos-15-intel
            name: cross
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      APP: target/aarch64-apple-darwin/release/bundle/osx/WarpLite.app
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install protobuf jq

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: warp-lite-release-${{ matrix.name }}

      - name: Install cargo-bundle
        run: script/install_cargo_bundle

      - name: Build and bundle
        working-directory: app
        run: cargo bundle --release --bin warp-oss --features gui,release_bundle --target aarch64-apple-darwin

      - name: Fix rpath and ad-hoc sign
        run: |
          script/macos/add_framework_rpath "$APP/Contents/MacOS/warp-oss"
          codesign --force --deep --sign - "$APP"

      - name: Report size
        run: |
          du -sh "$APP"
          lipo -archs "$APP/Contents/MacOS/warp-oss"
          ls -lh "$APP/Contents/MacOS/warp-oss"

      - name: Zip app
        run: ditto -c -k --keepParent "$APP" WarpLite-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WarpLite-macos-arm64-${{ matrix.name }}
          path: WarpLite-macos-arm64.zip
          retention-days: 14

# warp-lite: builds an unsigned macOS app bundle on GitHub's macOS runners,
# which ship with Xcode (needed for the Metal shader compiler).
# Branch pushes upload the zip as a workflow artifact; `v*` tags (or a manual
# run with `release` checked) also publish it as a GitHub Release.
name: Build macOS app

on:
  push:
    branches: ["master", "lite/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the built zip"
        type: boolean
        default: false
      tag:
        description: "Release tag (e.g. v0.1.0); created on this commit if it doesn't exist"
        type: string
        required: false

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Check release inputs
        if: github.event_name == 'workflow_dispatch' && inputs.release && !startsWith(github.ref, 'refs/tags/v') && inputs.tag == ''
        run: |
          echo "::error::Set the 'tag' input (e.g. v0.1.0) when 'release' is checked."
          exit 1

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install protobuf jq

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: warp-lite-release

      - name: Install cargo-bundle
        run: script/install_cargo_bundle

      - name: Build and bundle
        working-directory: app
        run: cargo bundle --release --bin warp-oss --features gui,release_bundle

      - name: Fix rpath and ad-hoc sign
        run: |
          APP=target/release/bundle/osx/WarpLite.app
          script/macos/add_framework_rpath "$APP/Contents/MacOS/warp-oss"
          codesign --force --deep --sign - "$APP"

      - name: Report size
        run: |
          du -sh target/release/bundle/osx/WarpLite.app
          ls -lh target/release/bundle/osx/WarpLite.app/Contents/MacOS/warp-oss

      - name: Zip app
        run: ditto -c -k --keepParent target/release/bundle/osx/WarpLite.app WarpLite-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WarpLite-macos-arm64
          path: WarpLite-macos-arm64.zip
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Warp Lite ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: WarpLite-macos-arm64.zip
          fail_on_unmatched_files: true
